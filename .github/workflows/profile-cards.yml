name: Update profile cards

# The cards are rendered here and committed as static SVGs rather than hot-linked from a
# public endpoint, so no third-party host sits in the request path when someone loads the
# profile. Needs the repo secret PROFILE_STATS_TOKEN (classic PAT, `repo` + `read:user`);
# without it the fallback below still renders, but private contributions are not counted.

on:
  schedule:
    - cron: "0 3 * * *" # 08:30 IST, daily
  push:
    paths:
      - ".github/workflows/profile-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

# A dispatch overlapping the cron would give two jobs pushing commits; the loser fails
# on a non-fast-forward.
concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not floating tags: these steps run with a token that can
      # read private repositories, and a tag can be repointed at any time.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Render stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=aadilkadiwal&show_icons=true&count_private=true&include_all_commits=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render streak card
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1
        with:
          options: user=aadilkadiwal&theme=tokyonight&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/streak.svg
          git diff --staged --quiet && echo "No change." && exit 0
          git commit -m "chore: refresh profile cards"
          git push
